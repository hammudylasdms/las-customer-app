name: My LAS Android Test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install project Flutter version
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare Android test branding
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/brand-tools"
          "$RUNNER_TEMP/brand-tools/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/brand-tools/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image
          app = Path('android/app/src/main')
          manifest = app / 'AndroidManifest.xml'
          text = manifest.read_text()
          assert 'android:label="LAS Top Technik"' in text or 'android:label="My LAS"' in text
          manifest.write_text(text.replace('android:label="LAS Top Technik"', 'android:label="My LAS"'))
          with Image.open('assets/branding/app_icon.png') as icon:
              for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
                  icon.resize((size,size), Image.Resampling.LANCZOS).save(app/'res'/('mipmap-'+density)/'ic_launcher.png')
          PY
      - name: Check and build installable APK
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --release --no-pub --dart-define=ENABLE_DEVICE_LOGIN=false --dart-define=ENABLE_PUSH=false --dart-define=PORTAL_ORIGIN=https://dms.lastoptechnik.com
          cp build/app/outputs/flutter-apk/app-release.apk My-LAS-Android-Test.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify My-LAS-Android-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: My-LAS-Android-Test
          path: My-LAS-Android-Test.apk
          if-no-files-found: error
          retention-days: 7
